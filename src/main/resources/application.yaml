server:
  port: ${PORT:8083}
  forward-headers-strategy: framework

spring:
  application:
    name: mcp-movements
  ai:
    mcp:
      server:
        name: movements
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        instructions: Access to the authenticated user's financial movements (expenses, income, refunds). Every tool only reads data, except create_movement which writes one movement and must be confirmed with the user first.
